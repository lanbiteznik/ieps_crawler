<!DOCTYPE html>
<html>
<head>
    <title>Ask a Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin-left: 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .button-container {
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="text-center mb-4">
            <h1 class="text-dark">Group DEMO</h1>
        </div>

        <div class="card shadow rounded-4">
            <div class="card-body p-5">
                <h2 class="card-title mb-4 text-primary">Ask a Question</h2>
                <form id="questionForm">
                    <div class="mb-3">
                        <label for="question" class="form-label">Question:</label>
                        <input type="text" class="form-control" id="question" name="question" required>
                    </div>
                    <div class="form-check mb-4">
                        <input type="checkbox" class="form-check-input" id="use_rag" name="use_rag" checked>
                        <label class="form-check-label" for="use_rag">Use RAG (retrieve relevant documents)</label>
                    </div>
                    <div class="button-container">
                        <button type="submit" class="btn btn-primary">Submit</button>
                        <div class="loader" id="loadingSpinner"></div>
                    </div>
                </form>

                <div class="mt-5">
                    <h4>Answer:</h4>
                    <div id="answerBox" class="alert alert-info" role="alert">Your answer will appear here.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
    const form = document.getElementById('questionForm');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const answerBox = document.getElementById('answerBox');
    
    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        const question = document.getElementById('question').value;
        const use_rag = document.getElementById('use_rag').checked;
        
        // Show loading spinner and update answer box
        loadingSpinner.style.display = 'block';
        answerBox.innerText = 'Processing your question...';
        
        try {
            const response = await fetch('/question', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question, use_rag })
            });
            
            const data = await response.json();
            answerBox.innerText = data.answer;
        } catch (error) {
            answerBox.innerText = `Error: ${error.message}`;
        } finally {
            // Hide loading spinner when done, whether successful or not
            loadingSpinner.style.display = 'none';
        }
    });
    </script>
</body>
</html>
